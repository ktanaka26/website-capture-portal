version: '3.9'

x-rails-image: &rails-image ghcr.io/ktanaka26/rails-website-capture
x-default-environment: &default-environment
  TZ: Asia/Tokyo

services:
  web:
    image: *rails-image
    build: .
    restart: always
    environment:
      <<: *default-environment
    env_file:
      - .env
      - .env_master_key
    ports:
      - 3000:3000
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_started
  redis:
    image: redis:7.0
    command: [
      "redis-server",
      "/usr/local/etc/redis/redis.conf",
      "--port", "0",
      "--tls-port", "6379",
      "--tls-cert-file", "/certs/server-cert.pem",
      "--tls-key-file", "/certs/server-key.pem",
      "--tls-ca-cert-file", "/certs/ca-cert.pem",
    ]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
      - ./certs:/certs:ro
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    environment:
      <<: *default-environment


  sidekiq:
    image: *rails-image
    build: .
    restart: always
    environment:
      <<: *default-environment
    env_file:
      - .env
      - .env_master_key
    command: bundle exec sidekiq -C /app/config/sidekiq.yml
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_started

  db:
    image: postgres:15.4
    environment:
      <<: *default-environment
    env_file:
      - .env
    volumes:
      - postgres_volume:/var/lib/postgresql/data
volumes:
  postgres_volume:
  redis-data:
    driver: local